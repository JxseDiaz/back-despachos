apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-despachos
  namespace: innovatech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-despachos
  template:
    metadata:
      labels:
        app: mysql-despachos
    spec:
      containers:
      - name: mysql
        image: mysql:8
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: { name: despachos-secret, key: MYSQL_ROOT_PASSWORD }
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef: { name: innovatech-config, key: DESPACHOS_DB_NAME }
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef: { name: despachos-secret, key: SPRING_DATASOURCE_USERNAME }
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef: { name: despachos-secret, key: SPRING_DATASOURCE_PASSWORD }
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-despachos-service
  namespace: innovatech
spec:
  selector:
    app: mysql-despachos
  ports:
  - port: 3306
    targetPort: 3306
