apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: innovatech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 951103920196.dkr.ecr.us-east-1.amazonaws.com/front-despachos:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        - containerPort: 8080
        - containerPort: 8081
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: innovatech
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: api-ventas
    port: 8080
    targetPort: 8080
  - name: api-despachos
    port: 8081
    targetPort: 8081
